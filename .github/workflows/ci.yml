name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_FLOOR: "100.0"

jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with coverage gate)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v c="$total" -v m="$COVERAGE_FLOOR" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "Coverage ${total}% below floor ${COVERAGE_FLOOR}%"; exit 1; }

  # Can a GitHub runner hold a ZFS pool?
  #
  # Nine integration tests in integration_linux_test.go create a file-backed
  # pool, write to it, send and receive it, and cross-check the result against
  # the zfs(8) CLI. Not one has ever run here. They need /dev/zfs and root, and
  # requireKernel skips BEFORE it looks for the CLI -- so installing
  # zfsutils-linux on its own would only move the skip one line down, which is
  # the thing that makes these lanes look fine.
  #
  # This job asserts /dev/zfs rather than skipping past it, so the answer is in
  # the log either way.
  kernel:
    name: the pool the tests have never had
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: install OpenZFS and load the module
        run: |
          set -x
          uname -r
          sudo apt-get update -qq
          # The module is not in the base image: zfsutils-linux is the CLI and
          # linux-modules-extra-$(uname -r) is where Ubuntu ships zfs.ko.
          sudo apt-get install -y -qq zfsutils-linux "linux-modules-extra-$(uname -r)" ||             sudo apt-get install -y -qq zfsutils-linux
          sudo modprobe zfs || true
          lsmod | grep -c zfs || true
          ls -l /dev/zfs || true

      # ⛔ An install is not a device node, in the same way an install is not a
      # binary. Say which one is missing instead of letting the tests skip.
      - name: /dev/zfs is really here
        run: |
          test -e /dev/zfs || { echo "::error::/dev/zfs absent; the integration tests cannot run on this image"; exit 1; }
          command -v zfs
          command -v zpool

      # Three tests -- PoolConfigs, Snapshot, CreateFilesystem -- want a pool
      # that is ALREADY imported, named by $ZFS_TEST_POOL (default
      # "testpool"). They do not create it, and they said so on the first run:
      #
      #   imported pools: 0
      #   pool "testpool" not found; got []
      #
      # That is the environment the validation host had and CI did not. A file
      # vdev is a real pool.
      - name: the pool those three tests assume
        run: |
          set -euxo pipefail
          truncate -s 2G "$RUNNER_TEMP/testpool.img"
          sudo zpool create -f testpool "$RUNNER_TEMP/testpool.img"
          sudo zpool list testpool

      - name: the integration tests, as root
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" ZFS_TEST_DIR=/var/tmp \
            go test -count=1 -v -run TestIntegration ./... 2>&1 | tee kernel-output.txt

      # requireKernel and the CLI check are the only two skip reasons here, and
      # both mean the pool never existed. A skip is green, which is why this
      # step is not optional.
      - name: the kernel judges must have judged
        run: |
          if grep -qE "skipping kernel integration test|need root|zfs CLI not found" kernel-output.txt; then
            echo "::error::a kernel integration test skipped; the pool was never built"
            exit 1
          fi
          grep -q -- "--- PASS: TestIntegration" kernel-output.txt || {
            echo "::error::no TestIntegration reported PASS"; exit 1; }

  emulated:
    name: emulated (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Set up binfmt (QEMU)
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            echo "Compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg" || {
                # Packages with no test files produce no binary; that is fine.
                echo "no test binary for $pkg (no tests?)"
              }
          done
          ls -l testbins
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bin in testbins/*.test; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD":/work -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v -test.short
            echo "::endgroup::"
          done

  # The 32-bit lane. Every other lane here is 64-bit, so nothing ever compiled
  # this package's tests where `int` is 32 bits wide -- and they did not
  # compile: an untyped constant above 2^31 passed where an int (or int32) is
  # expected is a compile error there and nowhere else. A library that builds
  # for 386 but whose tests do not is a library nobody has tested on 386.
  #
  # Each arch is vetted and its test binary compiled; a failed compile fails
  # the job (it is never swallowed: a skipped binary would be a green lane that
  # tested nothing). 386 then runs natively on the x86_64 runner, and arm runs
  # under the qemu binfmt_misc handler tonistiigi/binfmt registers -- the
  # binaries are static (CGO_ENABLED=0), so no container image is involved.
  # mips and mipsle are compile-only: tonistiigi/binfmt registers no
  # qemu-mips(el), and the binary fails with "Exec format error" (measured in
  # go-fsctl/blk's CI).
  thirtytwo:
    name: 32-bit (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "386"
            run: true
          - arch: arm
            run: true
          - arch: mips
            run: false
          - arch: mipsle
            run: false
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOARM: "7"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Vet (linux/${{ matrix.arch }})
        run: go vet ./...
      - name: Compile per-package test binaries (linux/${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            hastests=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")
            if [ -z "$hastests" ]; then
              echo "no test files for $pkg, skipping"
              continue
            fi
            name=$(echo "$pkg" | tr '/' '_')
            echo "Compiling test binary for $pkg"
            go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins
      - name: Set up binfmt (QEMU)
        if: matrix.run && matrix.arch == 'arm'
        run: docker run --rm --privileged tonistiigi/binfmt --install arm
      - name: Run test binaries (linux/${{ matrix.arch }})
        if: matrix.run
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(testbins/*.test)
          test ${#bins[@]} -gt 0 || { echo "::error::no test binary was built"; exit 1; }
          for bin in "${bins[@]}"; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            file "$bin"
            "$bin" -test.short -test.count=1
            echo "::endgroup::"
          done
